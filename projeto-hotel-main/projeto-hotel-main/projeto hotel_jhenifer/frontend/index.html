<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        /* Apenas um estilo básico para organizar */
        div { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input { width: 100%; max-width: 300px; padding: 5px; }
    </style>
</head>
<body>
    <nav> 
    
        <div>
         <!--logotipo/nome do hotel-->
         <a href="/">hotel caribe azul</a>
         <button type="button">
            <!--botao que aparece em telas pequenas-->
            <span></span>
         </button>
        <!-- itens de navegacao -->
           <div id="navbarNav">
             <ul> 
                <li>
                  <!--pagina atual: cadastro-->
                  <a href="/"> Cadastro</a>
                </li>
                <li>
                  <a href="/consulta"> Consulta</a>
                </li>
             </ul>
           </div>
        </div>> 
    </nav>

    <form id="formCadastro">
        <div>
            <label for="nome">Nome:</label>
            <input type="text"  name="nome" required>
        </div>

        <div>
            <label for="cpf">CPF:</label>
            <input type="text"  name="cpf" required>
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" name="email" required>
        </div>

        <div>
            <label for="endereco">Endereço:</label>
            <input type="text"  name="endereco" required>
        </div>

        <div>
            <label> telefone:</label>
            <input type="text" name="telefone" required>
        </div>

        <div>
            <label for="obs">Observação:</label>
            <textarea id="obs" name="observacao" rows="4"></textarea>
        </div>

        <button type="submit">Cadastrar</button>
    </form>
<script src="assets/main.js" ></script>   
</body>
</html>
